<script>
var U="https://cqbrtfeanazgttrlwwfz.supabase.co",K="sb_publishable_5WAikUK2dcYDTMq5phbJeg_nZvjnaH6";

function saveRt(){try{rt?localStorage.setItem("rt",rt):localStorage.removeItem("rt")}catch(e){}}
function H(){var h={apikey:K,"Content-Type":"application/json"};if(tok)h.Authorization="Bearer "+tok;return h}
async function api(p,o,n){o=o||{};var r=await fetch(U+"/rest/v1/"+p,{method:o.method||"GET",headers:H(),body:o.body});
 if(r.status==401&&rt&&!n){await refresh();return api(p,o,1)}
 if(!r.ok){alert("Error "+r.status);return null}
 return r.status==204?[]:r.json().catch(function(){return[]})}
async function refresh(){if(!rt)return;var r=await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:rt})});
 if(r.ok){var d=await r.json();tok=d.access_token;rt=d.refresh_token}else{tok=null;rt=null}saveRt()}
async function auth(kind){var e=v("em").trim(),p=v("pw");if(!e||p.length<6){alert("Email দিন, পাসওয়ার্ড কমপক্ষে ৬ অক্ষর");return}
 var u=kind=="in"?"/auth/v1/token?grant_type=password":"/auth/v1/signup";
 var r=await fetch(U+u,{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
 var d=await r.json().catch(function(){return{}});
 if(!r.ok||!d.access_token){alert(r.ok?"ইমেইলে কনফার্মেশন লিংক পাঠানো হয়েছে":(d.msg||d.error_description||"ব্যর্থ হয়েছে"));return}
 tok=d.access_token;rt=d.refresh_token;saveRt();start(true)}

async function start(fresh){document.getElementById("lg").innerHTML="";
 var a=await api("admins?select=email");admin=!!(a&&a.length);
 if(!admin){var me=await who(),s=await api("viewers?select=status&email=eq."+encodeURIComponent(me));
  if(s&&!s.length){await api("viewers",{method:"POST",body:JSON.stringify({email:me})});s=[{status:"pending"}]}
  if(s&&s[0]&&(s[0].status=="rejected"||s[0].status=="blocked")&&fresh){await api("viewers?email=eq."+encodeURIComponent(me),{method:"PATCH",body:JSON.stringify({status:"pending"})});s=[{status:"pending"}]}
  if(!s||s[0].status!="approved"){wait(s&&s[0]?s[0].status:"pending");return}}
 document.getElementById("app").style.display="block";
 groups=await api("groups?select=id,models")||[];if(admin)opts=await api("options?select=*&order=pos")||[];forms();run();if(admin)people();setView("store")}
var ppl=[];

async function people(){var rr=await rpc("admin_users");
 if(rr.ok&&Array.isArray(rr.d))ppl=rr.d.map(function(x){return{email:x.uemail,status:x.ustatus,has:x.uhas,confirmed:x.uconfirmed}});
 else ppl=(await api("viewers?select=*&order=created_at.desc")||[]).map(function(x){return{email:x.email,status:x.status,has:true,confirmed:true}});
 var rk={pending:0,approved:1};ppl.sort(function(a,b){return(rk[a.status]==null?2:rk[a.status])-(rk[b.status]==null?2:rk[b.status])});
 var n=ppl.filter(function(x){return x.status=="pending"}).length,h='<div class="card"><h3>ইউজার / অনুমোদন'+(n?' <span class="na">'+n+' নতুন</span>':'')+'</h3>';
 if(!ppl.length)h+='<p class="mu">এখনো কেউ সাইন আপ করেনি</p>';
 ppl.forEach(function(x,i){var b=x.status=="approved"?'':'<button class="p" onclick="setV('+i+',\'approved\')">✔ Approve</button> ';
  h+='<div class="row" style="align-items:center"><span style="flex:3 1 150px;word-break:break-all">'+esc(x.email)+' <span class="mu">('+x.status+(x.confirmed?'':', ইমেইল কনফার্ম হয়নি')+')</span></span><span>'+b+'<button onclick="delU('+i+')">Remove</button></span></div>'});
 document.getElementById("ppl").innerHTML=h+'</div>';pc=n;nav()}
async function setV(i,s){var x=ppl[i];await api(x.has?"viewers?email=eq."+encodeURIComponent(x.email):"viewers",{method:x.has?"PATCH":"POST",body:JSON.stringify(x.has?{status:s}:{email:x.email,status:s})});people()}
async function delU(i){var x=ppl[i];if(!confirm(x.email+" কে Remove করবেন?\nতার অ্যাকাউন্ট সম্পূর্ণ মুছে যাবে, সে আর লগইন করতে পারবে না (চাইলে নতুন করে Sign up করতে পারবে)।"))return;
 var r=await rpc("admin_delete_user",{target:x.email});
 if(!r.ok){await api("viewers?email=eq."+encodeURIComponent(x.email),{method:"PATCH",body:JSON.stringify({status:"rejected"})});alert("অ্যাক্সেস বন্ধ করা হয়েছে। অ্যাকাউন্ট সম্পূর্ণ মুছতে update.sql-এর SQL একবার চালাতে হবে।")}
 people()}
function search(){clearTimeout(timer);timer=setTimeout(run,250)}
async function run(){editIx=-1;mcache={};
 var q=v("q").toLowerCase().replace(/display|back part|middle part|button|battery/g,"").replace(/[(),*"]/g,"").trim();
 var p="items?select=*&order=model,category&limit=60"+(cat=="All"?"":"&category=eq."+encodeURIComponent(cat));
 if(q){var M=[];groups.forEach(function(g){if(g.models.some(function(m){return m.toLowerCase().indexOf(q)>-1}))M=M.concat(g.models)});
  var or=["model.ilike.*"+q+"*"];if(M.length)or.push("and(category.eq.Display,model.in.("+M.map(function(m){return'"'+m+'"'}).join(",")+"))");
  p+="&or="+encodeURIComponent("("+or.join(",")+")")}
 rows=await api(p)||[];draw()}
function sel(c){cat=c;run()}
function draw(){
 var by={},showB=admin||SHOW_BUY;cm=[];
 rows.forEach(function(r,ix){var k=r.model+"|"+r.category;(by[k]=by[k]||[]).push(ix)});
 var h="";
 Object.keys(by).forEach(function(k){var p=k.split("|"),g=groups.filter(function(g){return g.models.indexOf(p[0])>-1})[0];
  h+='<div class="card"><h3>'+esc(p[0])+' — '+p[1]+'</h3>';
  if(p[1]=="Display"){var oth=g?g.models.filter(function(x){return x!=p[0]}):[];
   if(oth.length)h+='<span class="badge">✔ মেলে: '+oth.map(esc).join(", ")+'</span>';
   if(admin){cm.push(p[0]);h+='<input class="cw" placeholder="মেলে এমন মডেল (ঐচ্ছিক), কমা দিয়ে লিখুন" value="'+esc(oth.join(", "))+'" onchange="setCompat(cm['+(cm.length-1)+'],this.value).then(run)">'}}
  h+='<table><tr><th>Type / Color</th>'+(showB?'<th>Buy</th>':'')+'<th>Sale</th><th>Status</th></tr>';
  by[k].forEach(function(ix){var r=rows[ix];
   if(admin&&ix==editIx){h+='<tr><td colspan="4"><div class="row"><input id="ed_m" placeholder="Model" value="'+esc(r.model)+'"><input id="ed_q" placeholder="Type / Color" value="'+esc(r.quality)+'"></div><div class="row"><input id="ed_b" type="number" placeholder="Buy" value="'+r.buy+'"><input id="ed_s" type="number" placeholder="Sale" value="'+r.sale+'"></div><div class="row"><label style="color:#facc15;flex:1 1 100%"><input type="checkbox" id="ed_r"'+(r.rx?' checked':'')+'> RX Stock</label></div><div class="row"><button class="p" onclick="saveEdit('+ix+')">Save</button><button onclick="editIx=-1;draw()">Cancel</button></div></td></tr>';return}
   h+='<tr><td class="q">'+esc(r.quality||"—")+(r.note?'<div class="mu">'+esc(r.note)+'</div>':'');
   if(admin)h+='<input class="wd" placeholder="⚠ সতর্কতা/রিকোয়ারমেন্ট" value="'+esc(r.warn)+'" onchange="upd('+ix+',\'warn\',this.value)">';
   else if(r.warn)h+='<div class="wr">⚠ '+esc(r.warn)+'</div>';
   h+=r.rx?'<div><span class="rxb">RX Stock</span></div>':'';
   h+='</td>';
   if(admin)h+='<td><input type="number" value="'+r.buy+'" onchange="upd('+ix+',\'buy\',+this.value)"></td><td><input type="number" value="'+r.sale+'" onchange="upd('+ix+',\'sale\',+this.value)"></td><td><button class="'+(r.available?"av":"na")+'" onclick="upd('+ix+',\'available\','+!r.available+',1)">'+(r.available?"Available":"Not Available")+'</button> <button onclick="del('+ix+')">🗑</button> <button onclick="editRow('+ix+')">✏</button></td>';
   else h+=(showB?'<td>৳'+r.buy+'</td>':'')+'<td>৳'+r.sale+'</td><td><span class="'+(r.available?"av":"na")+'">'+(r.available?"Available":"Not Available")+'</span></td>';
   h+='</tr>'});h+='</table></div>'});
 document.getElementById("res").innerHTML=h||'<p class="mu">কিছু পাওয়া যায়নি</p>';
 document.getElementById("cats").innerHTML=cats.map(function(c){return'<button class="'+(c==cat?"on":"")+'" onclick="sel(\''+c+'\')">'+c+'</button>'}).join("");
 document.getElementById("auth").innerHTML='<span class="mu">'+(admin?"Admin":"Viewer")+'</span> <button onclick="logout()">Logout</button>'}
function forms(){
 document.getElementById("addbox").innerHTML=admin?'<div class="card"><h3>নতুন প্রাইস যোগ করুন</h3><div class="row"><select id="nc" onchange="catChg();mhint()"><option>Display</option><option>Back Part</option><option>Middle Part</option><option>Button</option><option>Battery</option></select><input id="nm" placeholder="Model (Samsung A51)" oninput="mhint()"></div><div id="mh" style="color:#facc15;font-size:13px;margin:4px 0"></div><input id="nn" placeholder="Note (ঐচ্ছিক)" style="width:100%;margin-top:6px"><p class="mu">যে কোয়ালিটি আছে শুধু তার Buy/Sale লিখুন, টিক নিজে পড়ে যাবে।</p><div id="qs"></div><div class="row" id="orow"><input id="no" placeholder="নতুন কালার/কোয়ালিটি লিখুন"><button onclick="addOpt()">＋ অপশন যোগ</button></div><div id="cwrap"><input id="ac" placeholder="যে মডেলের ডিসপ্লের সাথে মেলে (ঐচ্ছিক), কমা দিয়ে লিখুন" style="width:100%;margin-top:6px"></div><div class="row"><button class="p" onclick="add()">Add</button><button onclick="togAdd()">Close</button></div></div>':"";document.getElementById("plus").style.display=admin?"block":"none";
 document.getElementById("adm").innerHTML=admin?'<div class="card"><h3>অপশন তালিকা (কালার / কোয়ালিটি)</h3><p class="mu">মুছতে ✕ চাপুন। নতুন যোগ করতে Store-এর ＋ ফর্মে "অপশন যোগ" ব্যবহার করুন।</p><div id="optl"></div></div><div class="card"><h3>Backup / Restore</h3><p class="mu">Backup: সব ডেটা CSV ফাইল হয়ে নামবে। Restore: আগের Backup ফাইল আপলোড করলে যেগুলো নেই সেগুলো ফিরে আসবে, যেগুলো আছে দ্বিগুণ হবে না।</p><div class="row"><button class="p" onclick="backup()">⬇ Backup CSV</button><button onclick="document.getElementById(\'rf\').click()">⬆ Restore CSV</button></div><input id="rf" type="file" accept=".csv" style="display:none" onchange="restore(this)"></div>':"";
 document.getElementById("acc").innerHTML='<div class="card"><h3>🔒 Security — পাসওয়ার্ড বদলান</h3><div class="row"><input id="op" type="password" placeholder="পুরনো পাসওয়ার্ড"></div><div class="row"><input id="np" type="password" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"><button class="p" onclick="chPw()">Change</button></div></div>';if(admin){qrows();optList()}}
async function chPw(){var o=v("op"),p=v("np");if(!o){alert("পুরনো পাসওয়ার্ড দিন");return}if(p.length<6){alert("নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দিন");return}
 var e=await who();var c=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:o})});
 if(!c.ok){alert("পুরনো পাসওয়ার্ড ভুল");return}

function olist(c){var l=opts.filter(function(o){return o.category==c}).map(function(o){return o.name});l=(opts.length?l:(QP[c]||[])).slice();if(c=="Display"&&l.indexOf("Display with Frame")<0){var i=l.indexOf("Original");l.splice(i<0?l.length:i+1,0,"Display with Frame")}return l}

 if(tgt){var have=f.L.filter(function(x){return x.model==tgt}).map(function(x){return x.quality}),dup=o.filter(function(r){return have.some(function(h){return nk(h)==nk(r.quality)})});

   if(dup.length)msg+='\n\nএই কোয়ালিটি আগে থেকেই আছে, তাই বাদ যাবে: '+dup.map(function(r){return r.quality||"(single)"}).join(", ")+'\n(দাম বদলাতে ✏ Edit ব্যবহার করুন)';

  o=o.filter(function(r){return dup.indexOf(r)<0});if(!o.length){alert("সবগুলো কোয়ালিটি আগে থেকেই আছে, নতুন কিছু যোগ হয়নি");return}

async function all(p){var out=[],n=0,b;do{b=await api(p+"&limit=1000&offset="+n)||[];out=out.concat(b);n+=1000}while(b.length==1000);return out}
function parseCSV(t){var r=[],row=[],f="",q=false;t=t.replace(/^\ufeff/,"");
 for(var i=0;i<t.length;i++){var c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}else f+=c}
 if(f||row.length){row.push(f);r.push(row)}return r}
async function restore(el){var file=el.files[0];if(!file)return;var rs=parseCSV(await file.text());el.value="";
 var hd=(rs.shift()||[]).map(function(x){return x.trim()});if(hd.indexOf("model")<0||hd.indexOf("category")<0){alert("এটা Backup ফাইল না");return}
 var ex=await all("items?select=model,category,quality&order=id"),seen={};ex.forEach(function(x){seen[[x.model,x.category,x.quality].join("|")]=1});
 var ad=[];rs.forEach(function(r){if(r.length<hd.length)return;var o={};hd.forEach(function(k,i){o[k]=r[i]});
  var k=[o.model,o.category,o.quality||""].join("|");if(!o.model||seen[k])return;seen[k]=1;
  ad.push(Object.assign({model:o.model,category:o.category,quality:o.quality||"",buy:+o.buy||0,sale:+o.sale||0,available:o.available!="false",warn:o.warn||"",note:o.note||""},o.rx=="true"?{rx:true}:{}))});
 if(!ad.length){alert("নতুন কিছু পাওয়া যায়নি, সব আগে থেকেই আছে");return}
 for(var i=0;i<ad.length;i+=500)await api("items",{method:"POST",body:JSON.stringify(ad.slice(i,i+500))});
 alert(ad.length+"টা আইটেম ফিরে এসেছে");run()}

var cm=[],editIx=-1;
var mcache={};
function nk(x){return x.toLowerCase().replace(/[^a-z0-9\u0980-\u09ff]/g,"")}
function ed1(a,b){if(a==b)return true;if(Math.abs(a.length-b.length)>1)return false;var i=0;while(i<a.length&&i<b.length&&a[i]==b[i])i++;
 if(a.length==b.length)return a.slice(i+1)==b.slice(i+1)||(a[i]==b[i+1]&&a[i+1]==b[i]&&a.slice(i+2)==b.slice(i+2));
 var l=a.length>b.length?a:b,sh=a.length>b.length?b:a;return l.slice(i+1)==sh.slice(i)}
async function getModels(c){if(!mcache[c]){var all=[],off=0;while(1){var d=await api("items?select=model,quality&category=eq."+encodeURIComponent(c)+"&order=id&limit=1000&offset="+off)||[];all=all.concat(d);if(d.length<1000)break;off+=1000}mcache[c]=all}return mcache[c]}
async function findM(m,c){var L=await getModels(c),k=nk(m),names={},ex=null,near=null;L.forEach(function(x){names[x.model]=1});
 if(k)Object.keys(names).forEach(function(n){var nn=nk(n);if(nn==k)ex=ex||n;else if(k.length>=5&&nn.replace(/\D/g,"")==k.replace(/\D/g,"")&&ed1(nn,k))near=near||n});
 return{ex:ex,near:near,L:L}}
